{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="editor-container">
    <h1 class="editor-title">Image Editor</h1>
    
    <div class="editor-layout">
        <!-- Original Image Column -->
        <div class="image-column">
            <h3>Original Image</h3>
            <div class="image-preview">
                <img src="{{ image.original_image.url }}" alt="Original Image">
            </div>
        </div>

        <!-- Processed Image Column -->
        <div class="image-column">
            <h3>Processed Image
                {% if image.processed_image %}
                <a href="{{ image.processed_image.url }}" download class="download-btn">
                    <i class="fas fa-download"></i> Download
                </a>
                {% endif %}
            </h3>
            <div class="image-preview">
                <img id="processed-image" src="{% if image.processed_image %}{{ image.processed_image.url }}{% else %}{% static 'placeholder.png' %}{% endif %}" alt="Processed Image">
            </div>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <h3>Editing Tools</h3>
        <div class="tool-buttons">
            <button class="tool-btn bg-remove" data-action="remove_bg">
                <i class="fas fa-eraser"></i> Remove Background
            </button>
            <button class="tool-btn fg-remove" data-action="remove_fg">
                <i class="fas fa-cut"></i> Remove Foreground
            </button>
        </div>
        
        <!-- Comparison Slider -->
        <div class="comparison-slider">
            <div class="before">
                <img src="{{ image.original_image.url }}" alt="Before">
            </div>
            <div class="after">
                <img src="{% if image.processed_image %}{{ image.processed_image.url }}{% else %}{{ image.original_image.url }}{% endif %}" alt="After">
            </div>
            <input type="range" min="0" max="100" value="50" class="slider">
        </div>
    </div>

    <!-- Status Indicators -->
    <div id="loading" class="status-box processing">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Processing your image...</p>
    </div>

    <div id="error-message" class="status-box error">
        <i class="fas fa-exclamation-circle"></i>
        <p class="error-text"></p>
    </div>
</div>

<script>
document.querySelectorAll('[data-action]').forEach(button => {
    button.addEventListener('click', function() {
        const action = this.dataset.action;
        const formData = new FormData();
        formData.append('action', action);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        // Show loading state
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('error-message').style.display = 'none';

        fetch("{{ request.path }}", {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error(response.statusText);
            return response.json();
        })
        .then(data => {
            if (data.image_url) {
                // Update processed image and comparison slider
                document.getElementById('processed-image').src = data.image_url;
                document.querySelector('.comparison-slider .after img').src = data.image_url;
                document.querySelector('.download-btn').href = data.image_url;
            }
        })
        .catch(error => {
            document.querySelector('.error-text').textContent = `Error: ${error.message}`;
            document.getElementById('error-message').style.display = 'flex';
        })
        .finally(() => {
            document.getElementById('loading').style.display = 'none';
        });
    });
});

// Comparison slider functionality
const slider = document.querySelector('.comparison-slider input[type="range"]');
slider.addEventListener('input', (e) => {
    const sliderPos = e.target.value;
    const after = document.querySelector('.comparison-slider .after');
    after.style.width = `${sliderPos}%`;
});
</script>

<style>
.editor-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 20px;
}

.editor-title {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 2rem;
}

.editor-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2rem;
}

.image-column {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 1rem;
    box-shadow: 0 2px 15px rgba(0,0,0,0.1);
}

.image-preview {
    position: relative;
    padding-top: 100%;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
}

.image-preview img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform 0.3s ease;
}

.tool-buttons {
    display: grid;
    gap: 1rem;
    margin-bottom: 2rem;
}

.tool-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
}

.tool-btn i {
    font-size: 1.2rem;
}

.bg-remove {
    background: #e74c3c;
    color: white;
}

.fg-remove {
    background: #3498db;
    color: white;
}

.tool-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.comparison-slider {
    position: relative;
    width: 100%;
    height: 400px;
    border-radius: 10px;
    overflow: hidden;
}

.comparison-slider .before,
.comparison-slider .after {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    overflow: hidden;
}

.comparison-slider .after {
    width: 50%;
    border-right: 3px solid white;
}

.comparison-slider img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.slider {
    position: absolute;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 100%;
    background: transparent;
    outline: none;
    margin: 0;
    z-index: 2;
}

.slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 3px;
    height: 100%;
    background: white;
    cursor: col-resize;
}

.status-box {
    display: none;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-radius: 8px;
    margin-top: 1rem;
}

.processing {
    background: #f8f9fa;
    color: #2c3e50;
}

.error {
    background: #fee;
    color: #e74c3c;
}

.download-btn {
    background: #2ecc71;
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    text-decoration: none;
    float: right;
    transition: background 0.3s ease;
}

.download-btn:hover {
    background: #27ae60;
}
</style>
{% endblock %}

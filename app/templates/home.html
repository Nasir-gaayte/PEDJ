{% extends 'base.html' %}

{% block content %}
    <h2>All Uploaded Images</h2>
    <a href="{% url 'upload_image' %}">
        <button class="btn btn-primary">Upload New Image</button>
    </a>
    
    <div class="image-list">
        {% if images %}
            <ul>
                {% for image in images %}
                    <li>
                        <img src="{{ image.image.url }}" alt="Image" width="200">
                        <p>Uploaded: {{ image.uploaded_at }}</p>
                        
                        <!-- Edit Button -->
                        <a href="{% url 'edit_image' image.id %}">
                            <button class="btn btn-secondary">Edit Image</button>
                        </a>
                        
                        <!-- Delete Button -->
                        <form action="{% url 'delete_image' image.id %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete this image?');">Delete</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No images uploaded yet.</p>
        {% endif %}
    </div>
{% endblock %}
